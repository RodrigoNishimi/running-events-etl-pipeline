name: Pipeline diario

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC = 05:00 no horario de Brasilia
  workflow_dispatch:        # botao "Run workflow" manual, pra testar

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -e ".[browser]"
      - run: playwright install --with-deps chromium

      - run: python -m corridas_etl.pipeline.daily
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ETL_USER_AGENT: "CorridasBot/0.1 (+https://seusite.com.br/bot)"
